name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.out.outputs.api }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
              - '.env.example'
      - id: out
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
          fi

  api-check:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: services/api/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -mod=readonly ./...

      - name: Test
        run: go test ./...

      # Slow install+scan — keep on main / manual only, not every PR.
      - name: govulncheck
        if: github.event_name != 'pull_request'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  api-smoke:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: services/api/go.sum

      # Skip rebuilding the API image (~35s). Postgres only in Docker; API binary on the runner.
      - name: Postgres + build API
        run: |
          cp .env.example .env
          docker compose up -d --wait db &
          pg_pid=$!
          (cd services/api && go build -mod=readonly -o /tmp/portclos-api ./cmd/server)
          wait "$pg_pid"

      - name: Run API
        run: |
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          mkdir -p data/uploads
          /tmp/portclos-api > /tmp/portclos-api.log 2>&1 &
          echo $! > /tmp/portclos-api.pid

      - name: Smoke test /health and houses
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health
          house_json=$(curl -fsS -X POST http://localhost:8080/houses \
            -H 'Content-Type: application/json' \
            -d '{"name":"Maison test"}')
          echo "$house_json" | grep -q 'Maison test'
          house_id=$(echo "$house_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS http://localhost:8080/houses | grep -q 'Maison test'
          curl -fsS -X POST "http://localhost:8080/houses/${house_id}/occupations" \
            -H 'Content-Type: application/json' \
            -d '{"start_date":"2026-08-01","end_date":"2026-08-03","note":"weekend"}' \
            | grep -q 'weekend'
          curl -fsS "http://localhost:8080/houses/${house_id}/occupations?from=2026-08-01&to=2026-08-31" \
            | grep -q 'weekend'

      - name: Tear down
        if: always()
        run: |
          if [ -f /tmp/portclos-api.pid ]; then
            kill "$(cat /tmp/portclos-api.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/portclos-api.log ]; then
            echo "::group::API log"
            cat /tmp/portclos-api.log
            echo "::endgroup::"
          fi
          docker compose down -v

  # Single required-check friendly gate (success when API jobs succeed or are skipped).
  ci:
    runs-on: ubuntu-latest
    needs: [api-check, api-smoke]
    if: always()
    steps:
      - name: Gate
        run: |
          check="${{ needs.api-check.result }}"
          smoke="${{ needs.api-smoke.result }}"
          echo "api-check=$check api-smoke=$smoke"
          for r in "$check" "$smoke"; do
            case "$r" in
              success|skipped) ;;
              *) echo "Failing gate due to: $r"; exit 1 ;;
            esac
          done

  deploy:
    runs-on: ubuntu-latest
    needs: [api-check, api-smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Validate deploy secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for name in DEPLOY_SSH_KEY DEPLOY_USER DEPLOY_HOST DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not configured"
              missing=1
            fi
          done
          exit $missing

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          log-public-key: false

      - name: Add host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            --exclude .env \
            --exclude .env.* \
            --exclude secrets \
            --exclude node_modules \
            --exclude apps/mobile/node_modules \
            --exclude .git \
            --exclude .expo \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_PATH} && docker-compose --profile metabase up -d --build"
