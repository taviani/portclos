name: Mobile

on:
  # Manual only — avoid burning EAS free-plan quota on every main merge.
  # Local dev: apps/mobile → npx expo start --ios (simulator).
  workflow_dispatch:
    inputs:
      submit_ios:
        description: "iOS: build preview + submit to TestFlight (needs secret EXPO_ASC_APP_ID)"
        type: boolean
        default: false
      submit_android:
        description: "Android: build preview + submit to Play internal (Google Play service account must already be on EAS)"
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eas-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - name: Validate mobile secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AUTH_ISSUER: ${{ secrets.EXPO_PUBLIC_AUTH_ISSUER }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          missing=0
          for name in EXPO_TOKEN EXPO_PUBLIC_API_URL EXPO_PUBLIC_AUTH_ISSUER EXPO_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not configured"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # owner / projectId: app.config.js reads EXPO_OWNER + EXPO_PROJECT_ID (no app.json mutate).
      - name: Inject private build env into eas.json (not committed)
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AUTH_ISSUER: ${{ secrets.EXPO_PUBLIC_AUTH_ISSUER }}
          EXPO_PUBLIC_AUTH_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_AUTH_CLIENT_ID }}
          EXPO_ASC_APP_ID: ${{ secrets.EXPO_ASC_APP_ID }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
          const apiUrl = process.env.EXPO_PUBLIC_API_URL;
          const authIssuer = process.env.EXPO_PUBLIC_AUTH_ISSUER;
          const authClientId = process.env.EXPO_PUBLIC_AUTH_CLIENT_ID || "portclos";
          for (const name of Object.keys(eas.build || {})) {
            eas.build[name].env = {
              ...(eas.build[name].env || {}),
              EXPO_PUBLIC_API_URL: apiUrl,
              EXPO_PUBLIC_AUTH_ISSUER: authIssuer,
              EXPO_PUBLIC_AUTH_CLIENT_ID: authClientId,
            };
          }
          const ascAppId = process.env.EXPO_ASC_APP_ID;
          if (ascAppId) {
            for (const name of Object.keys(eas.submit || {})) {
              eas.submit[name].ios = {
                ...(eas.submit[name].ios || {}),
                ascAppId,
              };
            }
          }
          fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2) + "\n");
          NODE

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build (optional store submit)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AUTH_ISSUER: ${{ secrets.EXPO_PUBLIC_AUTH_ISSUER }}
          EXPO_PUBLIC_AUTH_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_AUTH_CLIENT_ID }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
          EXPO_ASC_APP_ID: ${{ secrets.EXPO_ASC_APP_ID }}
          SUBMIT_IOS: ${{ github.event_name == 'workflow_dispatch' && inputs.submit_ios || false }}
          SUBMIT_ANDROID: ${{ github.event_name == 'workflow_dispatch' && inputs.submit_android || false }}
        run: |
          set -euo pipefail
          # Default: iOS build only (no submit). Android is opt-in via submit_android
          # so we do not burn Play quota accidentally.
          do_ios=true
          do_android=false
          if [ "${SUBMIT_ANDROID}" = "true" ] && [ "${SUBMIT_IOS}" != "true" ]; then
            do_ios=false
          fi
          if [ "${SUBMIT_ANDROID}" = "true" ]; then
            do_android=true
          fi

          eas_build() {
            local platform="$1"
            local submit="$2"
            local args=(build --platform "$platform" --profile preview --non-interactive --no-wait)
            if [ "$submit" = "true" ]; then
              args+=(--auto-submit)
            fi
            echo "eas ${args[*]}"
            eas "${args[@]}"
          }

          if [ "$do_ios" = "true" ]; then
            if [ "${SUBMIT_IOS}" = "true" ]; then
              if [ -z "${EXPO_ASC_APP_ID:-}" ]; then
                echo "::error::submit_ios requires secret EXPO_ASC_APP_ID"
                exit 1
              fi
              echo "Building iOS with TestFlight auto-submit."
              eas_build ios true
            else
              echo "Building iOS (build only)."
              eas_build ios false
            fi
          fi

          if [ "$do_android" = "true" ]; then
            echo "Building Android with Play internal auto-submit."
            eas_build android true
          fi
