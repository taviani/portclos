services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portclos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portclos}
      POSTGRES_DB: ${POSTGRES_DB:-portclos}
    # Bind localhost only — never expose Postgres on the public interface.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - portclos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portclos} -d ${POSTGRES_DB:-portclos}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  api:
    build:
      context: ./services/api
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    env_file: .env
    environment:
      PORT: "8080"
      UPLOAD_DIR: /data/uploads
      # Inside Docker, Postgres is the "db" service (overrides host DATABASE_URL from .env).
      DATABASE_URL: postgres://${POSTGRES_USER:-portclos}:${POSTGRES_PASSWORD:-portclos}@db:5432/${POSTGRES_DB:-portclos}?sslmode=disable
    volumes:
      - portclos_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Explore usage_events / client_events (and ad‑hoc SQL). Localhost only — SSH tunnel.
  # Profile keeps CI / default `up` fast (Metabase image is large and slow to start).
  # Start with: docker-compose --profile metabase up -d
  # Or target the service: docker-compose up -d metabase
  metabase:
    profiles: ["metabase"]
    image: metabase/metabase:v0.53.15.x
    ports:
      - "127.0.0.1:${METABASE_HOST_PORT:-3000}:3000"
    volumes:
      - portclos_metabase:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      db:
        condition: service_healthy

volumes:
  portclos_pg:
  portclos_uploads:
  portclos_metabase:
