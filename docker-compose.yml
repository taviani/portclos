version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portclos
      POSTGRES_PASSWORD: portclos
      POSTGRES_DB: portclos
    ports:
      - "5433:5432"
    volumes:
      - portclos_pg:/var/lib/postgresql/data

  api:
    build:
      context: ./services/api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.example.com}
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      DATABASE_URL: postgres://portclos:portclos@db:5432/portclos?sslmode=disable
    depends_on:
      - db

volumes:
  portclos_pg:
